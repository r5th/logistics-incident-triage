[project]
name = "triage"
version = "0.1.0"
description = "Logistics incident triage: rules baseline vs TypeSafe, with explicit review routing"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk", "python-dotenv"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
